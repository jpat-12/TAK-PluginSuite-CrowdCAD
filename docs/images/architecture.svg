<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#06b6d4"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="14" fill="#0f1219"/>

  <!-- CrowdCAD -->
  <rect x="20" y="140" width="170" height="110" rx="10" fill="#161b26" stroke="#ef4444" stroke-width="1.5"/>
  <text x="105" y="170" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">CrowdCAD</text>
  <text x="105" y="190" text-anchor="middle" fill="#cbd5e1" font-size="12">PocketBase backend</text>
  <text x="105" y="214" text-anchor="middle" fill="#94a3b8" font-size="11">one events record =</text>
  <text x="105" y="229" text-anchor="middle" fill="#94a3b8" font-size="11">calls · teams · venue</text>

  <!-- bridge -->
  <rect x="250" y="110" width="230" height="170" rx="10" fill="#161b26" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="365" y="138" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="700">crowdcad-tak bridge</text>
  <text x="365" y="156" text-anchor="middle" fill="#06b6d4" font-size="11">on your infra-TAK host</text>
  <rect x="266" y="168" width="198" height="26" rx="5" fill="#0a0e1a"/>
  <text x="365" y="186" text-anchor="middle" fill="#ffd43b" font-size="12">mapping.build — PHI boundary</text>
  <rect x="266" y="200" width="198" height="26" rx="5" fill="#0a0e1a"/>
  <text x="365" y="218" text-anchor="middle" fill="#cbd5e1" font-size="12">diff + send rules + heartbeat</text>
  <rect x="266" y="232" width="198" height="26" rx="5" fill="#0a0e1a"/>
  <text x="365" y="250" text-anchor="middle" fill="#cbd5e1" font-size="12">board API (read-only JSON)</text>

  <line x1="190" y1="195" x2="246" y2="195" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="218" y="130" text-anchor="middle" fill="#94a3b8" font-size="11">realtime SSE</text>
  <text x="218" y="145" text-anchor="middle" fill="#94a3b8" font-size="11">read-only</text>

  <!-- TAK Server -->
  <rect x="550" y="50" width="170" height="80" rx="10" fill="#161b26" stroke="#1e2736"/>
  <text x="635" y="84" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">TAK Server</text>
  <text x="635" y="104" text-anchor="middle" fill="#94a3b8" font-size="11">your medical TAK group</text>
  <path d="M480 160 C515 160 515 90 546 90" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="512" y="76" text-anchor="middle" fill="#94a3b8" font-size="11">CoT · mTLS :8089</text>

  <!-- Caddy -->
  <rect x="550" y="260" width="170" height="80" rx="10" fill="#161b26" stroke="#1e2736"/>
  <text x="635" y="290" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Caddy</text>
  <text x="635" y="308" text-anchor="middle" fill="#94a3b8" font-size="11">crowdcad-tak.&lt;fqdn&gt;</text>
  <text x="635" y="323" text-anchor="middle" fill="#94a3b8" font-size="11">/api/v1/* only · token</text>
  <path d="M480 245 C515 245 515 300 546 300" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#c)"/>

  <!-- clients -->
  <g font-size="13">
    <rect x="790" y="24" width="150" height="54" rx="8" fill="#161b26" stroke="#24c265"/>
    <text x="865" y="47" text-anchor="middle" fill="#f1f5f9" font-weight="700">ATAK + plugin</text>
    <text x="865" y="65" text-anchor="middle" fill="#94a3b8" font-size="11">board · status · alerts</text>

    <rect x="790" y="92" width="150" height="54" rx="8" fill="#161b26" stroke="#1e2736"/>
    <text x="865" y="115" text-anchor="middle" fill="#f1f5f9" font-weight="700">Any TAK client</text>
    <text x="865" y="133" text-anchor="middle" fill="#94a3b8" font-size="11">WinTAK, iTAK: markers</text>

    <rect x="790" y="236" width="150" height="54" rx="8" fill="#161b26" stroke="#5c9dff"/>
    <text x="865" y="259" text-anchor="middle" fill="#f1f5f9" font-weight="700">CloudTAK plugin</text>
    <text x="865" y="277" text-anchor="middle" fill="#94a3b8" font-size="11">via CloudTAK's server</text>

    <rect x="790" y="304" width="150" height="54" rx="8" fill="#161b26" stroke="#5c9dff"/>
    <text x="865" y="327" text-anchor="middle" fill="#f1f5f9" font-weight="700">WebTAK plugin</text>
    <text x="865" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">docked drawer</text>
  </g>
  <line x1="720" y1="80" x2="786" y2="54" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="720" y1="100" x2="786" y2="117" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <path d="M700 130 C740 190 760 220 786 250" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="742" y="186" fill="#94a3b8" font-size="10">map markers</text>
  <line x1="720" y1="290" x2="786" y2="268" stroke="#06b6d4" stroke-width="2" marker-end="url(#c)"/>
  <line x1="720" y1="310" x2="786" y2="328" stroke="#06b6d4" stroke-width="2" marker-end="url(#c)"/>

  <!-- PHI note -->
  <rect x="20" y="300" width="460" height="74" rx="10" fill="rgba(255,212,59,.07)" stroke="rgba(255,212,59,.35)"/>
  <text x="36" y="324" fill="#ffd43b" font-size="13" font-weight="700">Never leaves CrowdCAD</text>
  <text x="36" y="344" fill="#cbd5e1" font-size="12">age · sex · notes · call &amp; team logs · member names</text>
  <text x="36" y="362" fill="#94a3b8" font-size="11">Tested: every item is rendered from a fixture seeded with fake patient data.</text>

  <text x="940" y="390" text-anchor="end" fill="#475569" font-size="10">CrowdCAD for TAK — data flow</text>
</svg>
