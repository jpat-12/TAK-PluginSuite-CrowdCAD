  </g>
  <rect x="20" y="284" width="360" height="28" rx="5" fill="#111827" stroke="#374151"/><text x="30" y="303" fill="#6b7280" font-size="12">Filter callsigns</text>
  <rect x="20" y="318" width="360" height="190" rx="5" fill="#111827" stroke="#374151"/>
  <g font-size="12">
    <!-- rows -->
    <rect x="32" y="332" width="13" height="13" rx="2" fill="#3b82f6"/><text x="52" y="343" fill="#f9fafb">MEDIC-1</text>
    <rect x="160" y="326" width="92" height="24" rx="4" fill="#1f2937" stroke="#374151"/><text x="168" y="342" fill="#f9fafb">Team ▾</text>
    <rect x="258" y="326" width="112" height="24" rx="4" fill="#1f2937" stroke="#374151"/><text x="266" y="342" fill="#f9fafb">Team 1</text>
    <rect x="32" y="370" width="13" height="13" rx="2" fill="#3b82f6"/><text x="52" y="381" fill="#f9fafb">MEDIC-2</text>
    <rect x="160" y="364" width="92" height="24" rx="4" fill="#1f2937" stroke="#374151"/><text x="168" y="380" fill="#f9fafb">Team ▾</text>
    <rect x="258" y="364" width="112" height="24" rx="4" fill="#1f2937" stroke="#374151"/><text x="266" y="380" fill="#f9fafb">Team 2</text>
    <rect x="32" y="408" width="13" height="13" rx="2" fill="#3b82f6"/><text x="52" y="419" fill="#f9fafb">EMS-SUP</text>
    <rect x="160" y="402" width="92" height="24" rx="4" fill="#1f2937" stroke="#374151"/><text x="168" y="418" fill="#f9fafb">Supervisor ▾</text>
    <rect x="258" y="402" width="112" height="24" rx="4" fill="#1f2937" stroke="#374151"/><text x="266" y="418" fill="#f9fafb">Supervisor 1</text>
    <rect x="32" y="446" width="13" height="13" rx="2" fill="none" stroke="#6b7280"/><text x="52" y="457" fill="#9ca3af">COMMAND-1 · Command</text>
    <rect x="32" y="480" width="13" height="13" rx="2" fill="none" stroke="#6b7280"/><text x="52" y="491" fill="#9ca3af">EOC-DESK</text>
  </g>
  <text x="20" y="530" fill="#9ca3af" font-size="11">Each contact becomes one CrowdCAD unit carried by that</text>
  <text x="20" y="545" fill="#9ca3af" font-size="11">device. Assignments alert that phone (ATAK plugin).</text>
  <rect x="20" y="562" width="360" height="34" rx="6" fill="#2563eb"/>
  <text x="200" y="584" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Create event with 3 units</text>
