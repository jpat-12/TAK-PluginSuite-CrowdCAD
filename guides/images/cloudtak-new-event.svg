<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="620" rx="12" fill="#1b2a24"/>
  <!-- map -->
  <rect x="0" y="0" width="960" height="620" rx="12" fill="#2d3b33"/>
  <ellipse cx="660" cy="320" rx="220" ry="150" fill="#4b5058" stroke="#6b7280" stroke-width="2"/>
  <rect x="550" y="260" width="220" height="120" rx="6" fill="#2f7a3a" stroke="#e8ebf2"/>
  <text x="880" y="600" text-anchor="end" fill="#cbd5e1" font-size="11">CloudTAK map</text>
  <!-- panel -->
  <rect x="0" y="0" width="400" height="620" rx="12" fill="#1f2937"/>
  <rect x="0" y="0" width="400" height="48" rx="12" fill="#111827"/><rect y="36" width="400" height="12" fill="#111827"/>
  <text x="20" y="30" fill="#f9fafb" font-size="15" font-weight="700">‹  New CrowdCAD event</text>
  <g font-size="12" fill="#9ca3af">
    <text x="20" y="76">Event name</text><text x="20" y="130">Date</text><text x="20" y="184">Venue</text>
    <text x="20" y="276">Units from your TAK contacts</text><text x="380" y="276" text-anchor="end">3 picked</text>
  </g>
  <g font-size="13" fill="#f9fafb">
