<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="720" rx="12" fill="#080b14"/>
  <rect width="960" height="34" rx="12" fill="#1e2736"/><rect y="22" width="960" height="12" fill="#1e2736"/>
  <circle cx="18" cy="17" r="5" fill="#ef4444"/><circle cx="34" cy="17" r="5" fill="#eab308"/><circle cx="50" cy="17" r="5" fill="#10b981"/>
  <rect x="80" y="8" width="420" height="18" rx="9" fill="#0f1219"/>
  <text x="94" y="21" fill="#94a3b8" font-size="11">https://console.tak.example.org/crowdcad</text>
  <rect x="0" y="34" width="190" height="686" fill="#0f1219"/><line x1="190" y1="34" x2="190" y2="720" stroke="#1e2736"/>
  <text x="20" y="66" fill="#f1f5f9" font-size="15" font-weight="700">infra-TAK</text>
  <g font-size="13" fill="#cbd5e1"><text x="20" y="124">Dashboard</text><text x="20" y="154">TAK Server</text><text x="20" y="184">CloudTAK</text></g>
  <rect x="0" y="198" width="190" height="32" fill="rgba(6,182,212,.08)"/><rect x="0" y="198" width="2" height="32" fill="#06b6d4"/>
  <text x="20" y="219" fill="#06b6d4" font-size="13" font-weight="600">CrowdCAD</text>

  <text x="222" y="78" fill="#f1f5f9" font-size="22" font-weight="700">CrowdCAD for TAK</text>
  <rect x="222" y="96" width="710" height="40" rx="10" fill="rgba(234,179,8,.08)" stroke="rgba(234,179,8,.35)"/>
  <text x="238" y="121" fill="#eab308" font-size="13">● Waiting for settings — enter the CrowdCAD URL and bridge account below</text>

  <rect x="222" y="150" width="710" height="556" rx="12" fill="#161b26" stroke="#1e2736"/>
  <text x="240" y="180" fill="#f1f5f9" font-size="16" font-weight="700">Settings</text>
  <g font-size="12" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="240" y="208">CrowdCAD PocketBase URL (what CrowdCAD's NEXT_PUBLIC_POCKETBASE_URL points at)</text>
    <text x="240" y="262">CrowdCAD app URL — the site dispatchers sign in to; enables the Dispatch button</text>
    <text x="240" y="316">Bridge account (a CrowdCAD user; read-only use)</text>
    <text x="590" y="316">Password</text>
    <text x="240" y="370">Events: active for every active event, or event ids separated by commas</text>
    <text x="240" y="424">Publish to TAK</text>
    <text x="240" y="470">Teams carried by their own ATAK device — one per line: Team 1 = ANDROID-abc123</text>
    <text x="240" y="572">WebTAK page origins allowed to read the board — one per line</text>
  </g>
  <g font-family="Consolas, monospace" font-size="12">
    <rect x="240" y="216" width="676" height="32" rx="6" fill="#0a0e1a" stroke="#06b6d4"/><text x="250" y="237" fill="#f1f5f9">https://crowdcad.tak.example.org</text>
    <rect x="240" y="270" width="676" height="32" rx="6" fill="#0a0e1a" stroke="#1e2736"/><text x="250" y="291" fill="#f1f5f9">https://crowdcad.tak.example.org</text>
    <rect x="240" y="324" width="336" height="32" rx="6" fill="#0a0e1a" stroke="#1e2736"/><text x="250" y="345" fill="#f1f5f9">tak-bridge@example.org</text>
    <rect x="590" y="324" width="326" height="32" rx="6" fill="#0a0e1a" stroke="#1e2736"/><text x="600" y="345" fill="#f1f5f9">••••••••••••</text>
    <rect x="240" y="378" width="676" height="32" rx="6" fill="#0a0e1a" stroke="#1e2736"/><text x="250" y="399" fill="#f1f5f9">active</text>
    <rect x="240" y="478" width="676" height="76" rx="6" fill="#0a0e1a" stroke="#1e2736"/>
    <text x="250" y="499" fill="#f1f5f9">Team 1 = ANDROID-5f2c91d0a7b3</text>
    <text x="250" y="517" fill="#f1f5f9">Team 2 = ANDROID-8e14b6c2f9a0</text>
    <text x="250" y="535" fill="#f1f5f9">Supervisor 1 = ANDROID-1a9d73e4b25c</text>
    <rect x="240" y="580" width="676" height="44" rx="6" fill="#0a0e1a" stroke="#1e2736"/>
    <text x="250" y="601" fill="#64748b">https://webtak.tak.example.org</text>
  </g>
  <g font-size="12" fill="#cbd5e1">
    <rect x="240" y="434" width="13" height="13" rx="3" fill="#06b6d4"/><text x="260" y="445">Calls</text>
    <rect x="320" y="434" width="13" height="13" rx="3" fill="#06b6d4"/><text x="340" y="445">Teams</text>
    <rect x="400" y="434" width="13" height="13" rx="3" fill="#06b6d4"/><text x="420" y="445">Zones</text>
  </g>
  <rect x="240" y="644" width="200" height="36" rx="8" fill="#06b6d4"/>
  <text x="340" y="667" text-anchor="middle" fill="#04131a" font-size="13" font-weight="700">Save and restart bridge</text>
  <!-- callouts -->
  <g font-size="12" font-weight="700">
    <circle cx="930" cy="232" r="11" fill="#f97316"/><text x="930" y="236" text-anchor="middle" fill="#fff">A</text>
    <circle cx="930" cy="340" r="11" fill="#f97316"/><text x="930" y="344" text-anchor="middle" fill="#fff">B</text>
    <circle cx="930" cy="516" r="11" fill="#f97316"/><text x="930" y="520" text-anchor="middle" fill="#fff">C</text>
    <circle cx="460" cy="662" r="11" fill="#f97316"/><text x="460" y="666" text-anchor="middle" fill="#fff">D</text>
  </g>
</svg>
